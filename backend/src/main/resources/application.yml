spring:
  application:
    name: recruitment-assessment-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/recruitment_assessment}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 110MB
      max-request-size: 115MB
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

management:
  endpoints:
    web:
      exposure:
        include: health,info

server:
  port: ${SERVER_PORT:8080}

app:
  jwt:
    issuer: recruitment-assessment
    secret: ${JWT_SECRET:change-this-development-secret-32-bytes-minimum}
    ttl: PT8H
  public-base-url: ${PUBLIC_BASE_URL:http://localhost:5173/assessment}
  bootstrap:
    admin-username: ${INITIAL_ADMIN_USERNAME:admin}
    admin-password: ${INITIAL_ADMIN_PASSWORD:ChangeMe123!}
  candidate:
    store-mode: ${CANDIDATE_STORE_MODE:REDIS}
    code-ttl-seconds: ${CANDIDATE_CODE_TTL_SECONDS:300}
    session-ttl-seconds: ${CANDIDATE_SESSION_TTL_SECONDS:7200}
    cookie-name: ${CANDIDATE_COOKIE_NAME:candidate_session}
    cookie-secure: ${CANDIDATE_COOKIE_SECURE:true}
    debug-code-response: ${CANDIDATE_DEBUG_CODE_RESPONSE:false}
    storage-path: ${CANDIDATE_STORAGE_PATH:./data/uploads}
    max-file-bytes: ${CANDIDATE_MAX_FILE_BYTES:104857600}
    allowed-extensions: jpg,jpeg,png,gif,pdf,psd,blend,fbx,obj,zip,rar
