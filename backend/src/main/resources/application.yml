spring:
  application:
    name: recruitment-assessment-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:}
  datasource:
    url: ${DB_URL:jdbc:postgresql://192.168.11.217:5432/recruitment_assessment}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:!Qmyz@2024#jsb}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    ignore-migration-patterns: "*:missing"
  servlet:
    multipart:
      max-file-size: 1GB
      max-request-size: 1100MB
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

management:
  endpoints:
    web:
      exposure:
        include: health,info

server:
  port: ${SERVER_PORT:8082}

app:
  jwt:
    issuer: recruitment-assessment
    secret: ${JWT_SECRET:change-this-development-secret-32-bytes-minimum}
    ttl: PT8H
  public-base-url: ${PUBLIC_BASE_URL:http://localhost:5173/assessment}
  web-base-url: ${SYSTEM_WEB_BASE_URL:http://localhost:5173}
  bootstrap:
    admin-username: ${INITIAL_ADMIN_USERNAME:admin}
    admin-password: ${INITIAL_ADMIN_PASSWORD:ChangeMe123!}
  candidate:
    store-mode: ${CANDIDATE_STORE_MODE:REDIS}
    code-ttl-seconds: ${CANDIDATE_CODE_TTL_SECONDS:300}
    session-ttl-seconds: ${CANDIDATE_SESSION_TTL_SECONDS:7200}
    cookie-name: ${CANDIDATE_COOKIE_NAME:candidate_session}
    cookie-secure: ${CANDIDATE_COOKIE_SECURE:true}
    debug-code-response: ${CANDIDATE_DEBUG_CODE_RESPONSE:false}
    storage-path: ${CANDIDATE_STORAGE_PATH:./data/uploads}
    max-file-bytes: ${CANDIDATE_MAX_FILE_BYTES:1073741824}
  material:
    max-file-bytes: ${MATERIAL_MAX_FILE_BYTES:1073741824}
  dingtalk:
    enabled: ${DINGTALK_ENABLED:true}
    client-id: ${DINGTALK_CLIENT_ID:}
    client-secret: ${DINGTALK_CLIENT_SECRET:}
    robot-code: ${DINGTALK_ROBOT_CODE:}
